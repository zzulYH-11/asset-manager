<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Manager - 자산 현황</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<header class="bg-white border-b sticky top-0 z-10">
    <div class="max-w-md mx-auto px-4 h-16 flex items-center justify-between">
        <button onclick="location.href='/'" class="text-gray-600 hover:text-green-600 transition">
            <i class="fa-solid fa-arrow-left text-xl"></i>
        </button>
        <h1 class="text-xl font-bold text-gray-800">자산 현황</h1>
        <div class="w-6"></div>
    </div>
</header>

<main class="max-w-md mx-auto px-4 py-6">

    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-6"
         th:with="totalSum=${#aggregates.sum(assets.![price * quantity])}">

        <h2 class="text-sm font-semibold text-gray-400 mb-4 uppercase tracking-wider text-center">보유 비중 (Portfolio)</h2>
        <div class="w-full max-w-[250px] mx-auto">
            <canvas id="assetChart"></canvas>
        </div>
        <div class="mt-4 text-center">
            <p class="text-xs text-gray-400 font-medium">총 자산 평가액</p>
            <p class="text-2xl font-black text-gray-800"
               th:text="${totalSum != null} ? '$ ' + ${#numbers.formatInteger(totalSum, 3, 'COMMA')} : '$ 0'">
                $ 0
            </p>
        </div>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="p-4 border-b border-gray-50 bg-gray-50/50">
            <h2 class="font-bold text-gray-700">종합 잔고</h2>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead class="bg-gray-50 text-gray-500 uppercase text-[10px] font-bold">
                    <tr>
                        <th class="px-4 py-3">종목(Ticker)</th>
                        <th class="px-4 py-3">현재가</th>
                        <th class="px-4 py-3 text-right">보유수량</th>
                    </tr>
                </thead>

            <tbody class="divide-y divide-gray-100">
            <tr th:each="asset : ${assets}" class="hover:bg-gray-50 transition">

                <td class="px-4 py-4 font-bold text-gray-800" th:text="${asset.ticker}">
                    삼성전자
                </td>

                <td class="px-4 py-4 text-gray-600">
                    $ <span th:text="${#numbers.formatInteger(asset.price, 3, 'COMMA')}">0</span>
                </td>

                <td class="px-4 py-4 text-right font-medium text-blue-600" th:text="${asset.quantity}">
                    0
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(assets)}">
                <td colspan="3" class="px-4 py-10 text-center text-gray-400">
                    아직 등록된 자산이 없습니다.
                </td>
            </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<script th:inline="javascript">
    /*<![CDATA[*/
    // 서버에서 넘어온 assets 리스트를 JS 객체 배열로 변환
    const assetsData = /*[[${assets}]]*/ [];
    /*]]>*/

    // 차트에 필요한 라벨(Ticker)과 데이터(비중 계산용 금액) 추출
    const labels = assetsData.map(asset => asset.ticker);

    // 비중을 계산하기 위해 (가격 * 수량) 값을 추출
    const dataValues = assetsData.map(asset => asset.price * asset.quantity);

    // 차트 그리기 로직 시작...
</script>

<script>
    const ctx = document.getElementById('assetChart').getContext('2d');
    new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: labels,
            datasets: [{
                data: dataValues,
                backgroundColor: [
                    '#2563eb', // 파랑
                    '#10b981', // 초록
                    '#f59e0b', // 노랑
                    '#94a3b8'  // 회색
                ],
                borderWidth: 0,
                hoverOffset: 10
            }]
        },
        options: {
            plugins: {
                legend: { display: false } // 범례는 표가 있으니 숨김
            },
            cutout: '70%' // 도넛의 가운데 구멍 크기
        }
    });
</script>

</body>
</html>
