<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Manager - 자산 현황</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<header class="bg-white border-b sticky top-0 z-10">
    <div class="max-w-md mx-auto px-4 h-16 flex items-center justify-between">
        <button onclick="location.href='/'" class="text-gray-600 hover:text-green-600 transition">
            <i class="fa-solid fa-arrow-left text-xl"></i>
        </button>
        <h1 class="text-xl font-bold text-gray-800">자산 현황</h1>
        <div class="w-6"></div>
    </div>
</header>

<main class="max-w-md mx-auto px-4 py-6">

    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-6">
        <h2 class="text-sm font-semibold text-gray-400 mb-4 uppercase tracking-wider text-center">보유 비중 (Portfolio)</h2>
        <div class="w-full max-w-[250px] mx-auto">
            <canvas id="assetChart"></canvas>
        </div>
        <div class="mt-4 text-center">
            <p class="text-xs text-gray-400 font-medium">총 자산 평가액</p>
            <p class="text-2xl font-black text-gray-800">₩ 124,500,000</p>
        </div>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="p-4 border-b border-gray-50 bg-gray-50/50">
            <h2 class="font-bold text-gray-700">종합 잔고</h2>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead class="bg-gray-50 text-gray-500 uppercase text-[10px] font-bold">
                <tr>
                    <th class="px-4 py-3">종목이름</th>
                    <th class="px-4 py-3">가격</th>
                    <th class="px-4 py-3 text-right">수량</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                <tr class="hover:bg-gray-50 transition">
                    <td class="px-4 py-4 font-bold text-gray-800">삼성전자</td>
                    <td class="px-4 py-4 text-gray-600">₩ 75,000</td>
                    <td class="px-4 py-4 text-right font-medium">100</td>
                </tr>
                <tr class="hover:bg-gray-50 transition">
                    <td class="px-4 py-4 font-bold text-gray-800">애플(AAPL)</td>
                    <td class="px-4 py-4 text-gray-600">₩ 245,000</td>
                    <td class="px-4 py-4 text-right font-medium">50</td>
                </tr>
                <tr class="hover:bg-gray-50 transition">
                    <td class="px-4 py-4 font-bold text-gray-800">비트코인</td>
                    <td class="px-4 py-4 text-gray-600">₩ 102M</td>
                    <td class="px-4 py-4 text-right font-medium">0.85</td>
                </tr>
                <tr class="hover:bg-gray-50 transition">
                    <td class="px-4 py-4 font-bold text-gray-800">현금(KRW)</td>
                    <td class="px-4 py-4 text-gray-600">₩ 1.0</td>
                    <td class="px-4 py-4 text-right font-medium">5,000,000</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<script>
    const ctx = document.getElementById('assetChart').getContext('2d');
    new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['삼성전자', '애플', '비트코인', '현금'],
            datasets: [{
                data: [35, 25, 30, 10], // 자산 비중 예시
                backgroundColor: [
                    '#2563eb', // 파랑
                    '#10b981', // 초록
                    '#f59e0b', // 노랑
                    '#94a3b8'  // 회색
                ],
                borderWidth: 0,
                hoverOffset: 10
            }]
        },
        options: {
            plugins: {
                legend: { display: false } // 범례는 표가 있으니 숨김
            },
            cutout: '70%' // 도넛의 가운데 구멍 크기
        }
    });
</script>

</body>
</html>
