<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        /* 아이콘이 로딩되지 않더라도 공간을 확보하기 위한 최소 설정 */
        .icon-box { min-width: 3.5rem; min-height: 3.5rem; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div class="max-w-md w-full px-6">
    <div class="text-center mb-10">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Asset Manager</h1>
        <p class="text-gray-500 font-medium">원하는 기능을 선택하세요</p>
    </div>

    <div class="flex flex-col gap-4">

        <button onclick="location.href='/news'"
                class="w-full bg-white hover:bg-blue-50 text-gray-800 font-bold py-6 px-5 rounded-2xl shadow-sm border border-gray-200 flex items-center transition-all group">
            <div class="icon-box bg-blue-100 rounded-full flex items-center justify-center mr-4 group-hover:bg-blue-200 transition-colors">
                <i class="fa-solid fa-newspaper text-blue-600 text-xl"></i>
            </div>
            <span class="text-lg">뉴스 보기</span>
            <i class="fa-solid fa-chevron-right ml-auto text-gray-300"></i>
        </button>

        <button onclick="location.href='/assets'"
                class="w-full bg-white hover:bg-green-50 text-gray-800 font-bold py-6 px-5 rounded-2xl shadow-sm border border-gray-200 flex items-center transition-all group">
            <div class="icon-box bg-green-100 rounded-full flex items-center justify-center mr-4 group-hover:bg-green-200 transition-colors">
                <i class="fa-solid fa-wallet text-green-600 text-xl"></i>
            </div>
            <span class="text-lg">자산 현황</span>
            <i class="fa-solid fa-chevron-right ml-auto text-gray-300"></i>
        </button>

        <button onclick="location.href='/indicators'"
                class="w-full bg-white hover:bg-purple-50 text-gray-800 font-bold py-6 px-5 rounded-2xl shadow-sm border border-gray-200 flex items-center transition-all group">
            <div class="icon-box bg-purple-100 rounded-full flex items-center justify-center mr-4 group-hover:bg-purple-200 transition-colors">
                <i class="fa-solid fa-chart-line text-purple-600 text-xl"></i>
            </div>
            <span class="text-lg">지표 보기</span>
            <i class="fa-solid fa-chevron-right ml-auto text-gray-300"></i>
        </button>

    </div>

    <p class="text-center mt-12 text-xs text-gray-400 font-semibold tracking-widest uppercase">
        &copy; 2026 Asset Manager Project
    </p>
</div>

</body>
</html>
