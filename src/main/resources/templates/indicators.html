<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Manager - 지표</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen">

<header class="bg-white border-b sticky top-0 z-10">
    <div class="max-w-md mx-auto px-4 h-16 flex items-center justify-between">
        <button onclick="location.href='/'" class="text-gray-600 hover:text-purple-600 transition">
            <i class="fa-solid fa-arrow-left text-xl"></i>
        </button>
        <h1 class="text-xl font-bold text-gray-800">주요 경제 지표</h1>
        <div class="w-6"></div>
    </div>
</header>

<main class="max-w-md mx-auto px-4 py-6">
    <div class="grid grid-cols-2 gap-4">

        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
            <p class="text-xs text-gray-500 mb-1">KOSPI</p>
            <h2 class="text-xl font-bold text-gray-800 mb-2">2,685.30</h2>
            <div class="text-sm font-semibold text-red-500">
                <i class="fa-solid fa-caret-up"></i> 0.45%
            </div>
        </div>

        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
            <p class="text-xs text-gray-500 mb-1">NASDAQ</p>
            <h2 class="text-xl font-bold text-gray-800 mb-2">16,332.56</h2>
            <div class="text-sm font-semibold text-blue-500">
                <i class="fa-solid fa-caret-down"></i> 0.12%
            </div>
        </div>

        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
            <p class="text-xs text-gray-500 mb-1">USD/KRW</p>
            <h2 class="text-xl font-bold text-gray-800 mb-2">1,342.50</h2>
            <div class="text-sm font-semibold text-red-500">
                <i class="fa-solid fa-caret-up"></i> 2.10
            </div>
        </div>

        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
            <p class="text-xs text-gray-500 mb-1">BTC/KRW</p>
            <h2 class="text-sm font-bold text-gray-800 mb-2 leading-tight">102,450,000</h2>
            <div class="text-sm font-semibold text-red-500">
                <i class="fa-solid fa-caret-up"></i> 1.5%
            </div>
        </div>

        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
            <p class="text-xs text-gray-500 mb-1">US 10Y</p>
            <h2 class="text-xl font-bold text-gray-800 mb-2">4.32%</h2>
            <div class="text-sm font-semibold text-gray-400">
                <i class="fa-solid fa-minus"></i> 0.00
            </div>
        </div>

        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
            <p class="text-xs text-gray-500 mb-1">GOLD</p>
            <h2 class="text-xl font-bold text-gray-800 mb-2">2,354.1</h2>
            <div class="text-sm font-semibold text-red-500">
                <i class="fa-solid fa-caret-up"></i> 0.8%
            </div>
        </div>

    </div>

    <div class="mt-8 p-4 bg-purple-50 rounded-xl border border-purple-100">
        <p class="text-xs text-purple-600 leading-relaxed text-center">
            <i class="fa-solid fa-circle-info mr-1"></i>
            위 데이터는 현재 예시 데이터입니다.<br>추후 한국은행 및 주식 API 연동이 필요합니다.
        </p>
    </div>
</main>

</body>
</html>
